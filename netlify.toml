# netlify.toml - CONFIGURAÇÃO OTIMIZADA PARA PERFORMANCE

# Headers para melhor cache e compressão
[[headers]]
  for = "/*"
  [headers.values]
    # Segurança
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    
    # Performance - Habilitando Brotli
    Content-Encoding = "br, gzip"
    Vary = "Accept-Encoding"

# LANDING PAGE LIMPEZA DENTAL - Configuração específica
[[headers]]
  for = "/lp/limpeza-dental-ipanema"
  [headers.values]
    # Preload crítico de imagens AVIF otimizadas
    Link = '''
      </assets/consulta-inicial-hero-760x996-optimized.avif>; rel=preload; as=image; type=image/avif; fetchpriority=high; media="(min-width: 768px)",
      </assets/consulta-inicial-hero-512x672-optimized.avif>; rel=preload; as=image; type=image/avif; fetchpriority=high; media="(max-width: 767px)",
      </fonts/montserrat-400.woff2>; rel=preload; as=font; type=font/woff2; crossorigin
    '''
    # Cache agressivo com stale-while-revalidate
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    # Habilitando compressão máxima
    Content-Encoding = "br, gzip"
    # Early Hints para recursos críticos
    103-Early-Hints = '''
      Link: </assets/consulta-inicial-hero-760x996-optimized.avif>; rel=preload; as=image; type=image/avif
      Link: </fonts/montserrat-400.woff2>; rel=preload; as=font; type=font/woff2; crossorigin
    '''

# Imagens AVIF - Cache permanente
[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept"
    Content-Type = "image/avif"

# Imagens WebP - Cache permanente
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept"
    Content-Type = "image/webp"

# Assets otimizados - Cache permanente
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "br, gzip"

# JavaScript - Cache permanente com Brotli
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "br, gzip"
    Content-Type = "application/javascript; charset=utf-8"

# CSS - Cache permanente com Brotli
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "br, gzip"
    Content-Type = "text/css; charset=utf-8"

# Fontes WOFF2 - Cache permanente
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Content-Type = "font/woff2"

# Edge Functions para performance
[[edge_functions]]
  path = "/lp/limpeza-dental-ipanema"
  function = "optimize-images"

# Redirects para CDN de imagens
[[redirects]]
  from = "/assets/consulta-inicial-hero-*.avif"
  to = "https://d1234567890.cloudfront.net/assets/:splat.avif"
  status = 200
  force = false
  headers = {Cache-Control = "public, max-age=31536000, immutable"}

# Configuração de Build
[build]
  # Comando de build otimizado
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Variáveis de ambiente para build otimizado
  NODE_ENV = "production"
  GENERATE_SOURCEMAP = "false"

# Plugins Netlify para performance
[[plugins]]
  package = "@netlify/plugin-lighthouse"
  [plugins.inputs]
    thresholds = {performance = 90, accessibility = 90, "best-practices" = 90, seo = 90}

[[plugins]]
  package = "netlify-plugin-image-optim"
  [plugins.inputs]
    quality = 85
    formats = ["avif", "webp"]

[[plugins]]
  package = "netlify-plugin-inline-critical-css"
  [plugins.inputs]
    extract = true
    dimensions = [
      {width = 414, height = 896},
      {width = 1920, height = 1080}
    ]

# Função para otimização de imagens em tempo real
[functions]
  directory = "netlify/functions"
