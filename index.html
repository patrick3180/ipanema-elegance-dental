    <!-- Defer non-critical scripts -->
    <script>
      // Optimized GCLID tracking - non-blocking
      (function() {
        function getUrlParameter(name) {
          name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
          var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
          var results = regex.exec(location.search);
          return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }
        
        function setCookie(name, value, days) {
          var expires = "";
          if (days) {
            var date = new Date();
            date.setTime(date.getTime() + (days*24*60*60*1000));
            expires = "; expires=" + date.toUTCString();
          }
          document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }
        
        var gclid = getUrlParameter('gclid');
        if (gclid) {
          setCookie('gclid', gclid, 90);
          try {
            localStorage.setItem('gclid', gclid);
            localStorage.setItem('gclid_timestamp', new Date().toISOString());
          } catch(e) {}
        }
      })();
    </script>

    <!-- GCLID Tracking Footer Script -->
    <script>
    (function() {
        // Function to get cookie by name
        function getCookie(name) {
            var nameEQ = name + "=";
            var ca = document.cookie.split(';');
            for(var i=0;i < ca.length;i++) {
                var c = ca[i];
                while (c.charAt(0)==' ') c = c.substring(1,c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length,c.length);
            }
            return null;
        }
        
        // Function to send GCLID data to webhook
        function sendGclidData(gclid, source) {
            var data = {
                gclid: gclid,
                page: window.location.href,
                timestamp: new Date().toISOString(),
                source: source || 'unknown'
            };
            
            console.log('Sending GCLID data from ' + source + ':', data);
            
            // Send data to webhook with keepalive to ensure delivery even if page unloads
            fetch('https://n8n.srv876901.hstgr.cloud/webhook/webhook/gclid', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data),
                keepalive: true // Ensures request completes even if page unloads
            }).then(function() {
                console.log('GCLID data sent successfully:', data);
            }).catch(function(error) {
                console.log('Error sending GCLID data:', error);
            });
        }
        
        // Function to check if URL contains WhatsApp
        function isWhatsAppUrl(url) {
            return url && (url.includes('wa.me') || url.includes('api.whatsapp.com'));
        }
        
        // Function to get GCLID from storage
        function getStoredGclid() {
            var gclid = getCookie('gclid');
            if (!gclid) {
                try {
                    gclid = localStorage.getItem('gclid');
                } catch(e) {
                    console.log('LocalStorage not available');
                }
            }
            return gclid;
        }
        
        // Intercept window.open calls for WhatsApp URLs
        var originalWindowOpen = window.open;
        window.open = function(url, target, features) {
            console.log('window.open intercepted:', url);
            
            if (isWhatsAppUrl(url)) {
                console.log('WhatsApp URL detected in window.open:', url);
                var gclid = getStoredGclid();
                if (gclid) {
                    sendGclidData(gclid, 'window.open');
                } else {
                    console.log('No GCLID found for window.open WhatsApp call');
                }
            }
            
            // Call original window.open
            return originalWindowOpen.call(this, url, target, features);
        };
        
        // Wait for DOM to be ready before adding event listeners
        function addWhatsAppListeners() {
            // Find all WhatsApp links (wa.me and api.whatsapp.com)
            var whatsappLinks = document.querySelectorAll('a[href*="wa.me"], a[href*="api.whatsapp.com"]');
            
            // Also find dynamically created links by checking all links
            var allLinks = document.querySelectorAll('a');
            for (var i = 0; i < allLinks.length; i++) {
                var link = allLinks[i];
                if (link.href && isWhatsAppUrl(link.href)) {
                    if (Array.prototype.indexOf.call(whatsappLinks, link) === -1) {
                        whatsappLinks = Array.prototype.slice.call(whatsappLinks);
                        whatsappLinks.push(link);
                    }
                }
            }
            
            console.log('Found WhatsApp links:', whatsappLinks.length);
            
            // Add click event listeners to WhatsApp links
            for (var i = 0; i < whatsappLinks.length; i++) {
                whatsappLinks[i].addEventListener('click', function(event) {
                    console.log('WhatsApp link clicked:', this.href);
                    
                    var gclid = getStoredGclid();
                    
                    // Send GCLID data if available
                    if (gclid) {
                        sendGclidData(gclid, 'direct-link');
                    } else {
                        console.log('No GCLID found for direct link click');
                    }
                    
                    // Don't prevent default behavior - let WhatsApp link work normally
                });
            }
        }
        
        // Run when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', addWhatsAppListeners);
        } else {
            addWhatsAppListeners();
        }
        
        // Also check periodically for dynamically added WhatsApp links
        setInterval(addWhatsAppListeners, 2000);
        
        console.log('GCLID tracking script initialized - window.open intercepted');
    })();
    </script>
    <!-- End GCLID Tracking Footer Script -->
