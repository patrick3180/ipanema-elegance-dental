<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Dra. Carla Christoph</title>
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #CFCBB4 0%, #B3955F 100%);
      color: #381F47;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 2rem;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      color: #381F47;
      margin-bottom: 1rem;
    }
    p {
      margin-bottom: 1.5rem;
      color: #666;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      background: #f0f0f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }
    .retry-btn {
      background: #B3955F;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s;
    }
    .retry-btn:hover {
      background: #9a7d47;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📱</div>
    <h1>Você está offline</h1>
    <p>Não foi possível conectar à internet. Verifique sua conexão e tente novamente.</p>
    <button class="retry-btn" onclick="window.location.reload()">
      Tentar novamente
    </button>
  </div>
  
  <script>
    // Auto-retry when back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
